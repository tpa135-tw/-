name: Daily Taiwan Stock Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * *' # 台灣時間 07:30 執行

jobs:
  run-stock:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Packages
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pandas yfinance twstock feedparser requests lxml
          # 直接下載 zip 避開 git 權限問題
          pip install https://github.com/twopirllc/pandas-ta/archive/refs/heads/master.zip

      - name: Run Scanner
        env:
          YAHOO_EMAIL: ${{ secrets.YAHOO_EMAIL }}
          YAHOO_PASSWORD: ${{ secrets.YAHOO_PASSWORD }}
        run: python stock_auto.py

      - name: Commit and Push Results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "Auto-update stock results" || echo "No changes to commit"
          git push
