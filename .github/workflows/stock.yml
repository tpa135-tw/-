name: Daily Taiwan Stock Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * *'

jobs:
  run-stock:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Packages
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # 鎖定 pandas 版本以確保與 pandas-ta 相容
          pip install pandas==2.2.2 yfinance twstock feedparser requests lxml
          # 終極安裝方式：繞過 git clone 與特定 zip 路徑限制
          pip install https://github.com/twopirllc/pandas-ta/tarball/master

      - name: Run Scanner
        env:
          YAHOO_EMAIL: ${{ secrets.YAHOO_EMAIL }}
          YAHOO_PASSWORD: ${{ secrets.YAHOO_PASSWORD }}
        run: python stock_auto.py

      - name: Commit and Push Results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "Auto-update stock results" || echo "No changes to commit"
          git push
