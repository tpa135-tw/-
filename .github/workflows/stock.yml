name: Daily Taiwan Stock Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * *'

jobs:
  run-stock:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Packages
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # 鎖定 pandas 版本，確保與 pandas-ta 相容
          pip install pandas==2.2.2 yfinance twstock feedparser requests lxml
          
          # 使用 GitHub 內建的 Token 進行授權克隆，這是最穩定的安裝方式
          # 這樣就不會出現 "could not read Username" 的錯誤
          git clone --depth 1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/twopirllc/pandas-ta.git
          cd pandas-ta
          pip install .
          cd ..

      - name: Run Scanner
        env:
          YAHOO_EMAIL: ${{ secrets.YAHOO_EMAIL }}
          YAHOO_PASSWORD: ${{ secrets.YAHOO_PASSWORD }}
        run: python stock_auto.py

      - name: Commit and Push Results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "Auto-update stock results" || echo "No changes to commit"
          git push
