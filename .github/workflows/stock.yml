name: Daily Taiwan Stock Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * *' # 台灣時間隔天早上 07:30

jobs:
  run-stock:
    runs-on: ubuntu-latest
    # 授予寫入權限，以便將結果推回 Repo
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Packages
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance twstock feedparser pandas-ta lxml requests

      - name: Run Scanner
        env:
          YAHOO_EMAIL: ${{ secrets.YAHOO_EMAIL }}
          YAHOO_PASSWORD: ${{ secrets.YAHOO_PASSWORD }}
        run: python stock_auto.py

      - name: Commit and Push Results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "Auto-update stock scan results" || echo "No changes to commit"
          git push
