name: 台灣股票分析師

on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * 0-4'

jobs:
  run-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Packages
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests feedparser pandas-ta

      - name: Run Stock Scanner
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python -u stock_auto.py
