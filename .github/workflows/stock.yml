name: Daily Taiwan Stock Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * *' # 台灣時間 07:30 執行

jobs:
  run-stock:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Packages
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # 鎖定 pandas 版本，因為 pandas-ta 與 pandas 3.0+ 不相容
          pip install pandas==2.2.2 yfinance twstock feedparser requests lxml
          # 使用最原始的 Git 連結安裝，避開所有 zip 損壞與權限問題
          pip install git+https://github.com/twopirllc/pandas-ta.git

      - name: Run Scanner
        env:
          YAHOO_EMAIL: ${{ secrets.YAHOO_EMAIL }}
          YAHOO_PASSWORD: ${{ secrets.YAHOO_PASSWORD }}
        run: python stock_auto.py

      - name: Commit and Push Results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "Auto-update stock results" || echo "No changes to commit"
          git push
