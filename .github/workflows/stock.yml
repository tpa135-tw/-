name: Daily Taiwan Stock Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * *' # 台灣時間 07:30 執行

jobs:
  run-stock:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Packages
        run: |
          - name: Install Packages
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pandas yfinance twstock feedparser requests lxml
          # 改用最穩定的 git+https 語法，這會讓 pip 自動抓取預設分支 (可能是 master 或 main)
          # 如果之前 git clone 報錯 128，是因為 GitHub 需要 token，我們改用以下寫法：
          pip install git+https://github.com/twopirllc/pandas-ta.git

      - name: Run Scanner
        env:
          YAHOO_EMAIL: ${{ secrets.YAHOO_EMAIL }}
          YAHOO_PASSWORD: ${{ secrets.YAHOO_PASSWORD }}
        run: python stock_auto.py

      - name: Commit and Push Results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "Auto-update stock results" || echo "No changes to commit"
          git push
