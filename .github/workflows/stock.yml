name: Daily Taiwan Stock Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * *'

jobs:
  run-stock:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Packages
      run: |
        python -m pip install --upgrade pip
        pip install pandas yfinance twstock feedparser
        pip install git+https://github.com/twopirllc/pandas-ta.git

    - name: Run Scanner
      env:
        YAHOO_EMAIL: ${{ secrets.YAHOO_EMAIL }}
        YAHOO_PASSWORD: ${{ secrets.YAHOO_PASSWORD }}
      run: python stock_auto.py
