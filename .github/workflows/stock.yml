name: Daily Taiwan Stock Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * *'

jobs:
  run-stock:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Packages
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # 鎖定 pandas 版本，避免 pandas-ta 不相容
          pip install pandas==2.2.2 yfinance twstock feedparser requests lxml
          
          # 修正重點：使用 curl 下載 zip 並透過 pip 安裝
          # 這完全不需要 git 權限，也不會觸發 Username 檢查
          curl -L https://github.com/twopirllc/pandas-ta/archive/refs/heads/master.zip -o pandas-ta.zip
          pip install pandas-ta.zip

      - name: Run Scanner
        env:
          YAHOO_EMAIL: ${{ secrets.YAHOO_EMAIL }}
          YAHOO_PASSWORD: ${{ secrets.YAHOO_PASSWORD }}
        run: python stock_auto.py

      - name: Commit and Push Results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "Auto-update stock results" || echo "No changes to commit"
          git push
